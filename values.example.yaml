# Example configuration with multiple hosts and configurable paths

doAccessToken: "your-do-token"

ingress:
  name: "my-app"
  namespace: "default"
  whitelist:
    enabled: false
    whitelistSourceRange: ""
  rateLimit:
    enabled: true
    # Allow 20 requests per second per IP
    rps: 20
    # Allow maximum 10 concurrent connections per IP
    connections: 10
    # Burst multiplier - allows bursts up to rps * burstMultiplier
    burstMultiplier: 5
    # Exclude internal networks from rate limiting
    whitelist: ""
    # Alternative: Use rpm instead of rps for longer time windows
    # rpm: 1200
  # Note: Rate limit response codes are customized in the ingress-nginx config below
  hosts:
    # Main site - defaults to "/" path and "Prefix" pathType
    - host: "sitename.com"
      service: "main-service"
      port: 80
    
    # API with custom path
    - host: "api.sitename.com"
      service: "api-service"
      port: 8080
      path: "/v1"
      pathType: "Prefix"

issuer:
  name: "letsencrypt-prod"
  namespace: "cert-manager"
  email: "email@something.com"

ingress-nginx:
  controller:
    ingressClassResource:
      name: "my-app-nginx"
    replicaCount: 1
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: true
        service.beta.kubernetes.io/do-loadbalancer-tls-passthrough: "true"
    config:
      use-proxy-protocol: true
      # Global rate limiting response customization (affects ALL ingresses)
      limit-req-status-code: "429"  # HTTP 429 "Too Many Requests"
      limit-conn-status-code: "429" # HTTP 429 for connection limits
      # Other global nginx settings:
      # server-tokens: "false"       # Hide nginx version
      # ssl-protocols: "TLSv1.2 TLSv1.3"  # Allowed SSL protocols
    metrics:
      enabled: true
      service:
        servicePort: "9090"
    podAnnotations:
      prometheus.io/port: "10254"
      prometheus.io/scrape: "true"
